name: Build Android APK — Transcripteur vocal

on:
  workflow_dispatch:   # déclenchement manuel depuis l'interface GitHub
  push:
    branches:
      - claude/android-voice-transcriber-apk-g82j3f
      - main
    paths:
      - 'transcripteur-vocal/**'
      - '.github/workflows/build-transcripteur-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ──────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── Node.js ───────────────────────────────────────────────────────────
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Build web (Vite) ─────────────────────────────────────────────────
      - name: Install npm dependencies
        working-directory: transcripteur-vocal
        run: npm install

      - name: Build web assets (Vite)
        working-directory: transcripteur-vocal
        env:
          VITE_OPENAI_API_KEY: ${{ secrets.VITE_OPENAI_API_KEY }}
        run: npm run build

      # ── Projet Android (Capacitor) ────────────────────────────────────────
      - name: Add Capacitor Android platform
        working-directory: transcripteur-vocal
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: transcripteur-vocal
        run: npx cap sync android

      # ── Sources natives (service de premier plan) ─────────────────────────
      # MainActivity n'ajoute qu'un registerPlugin avant super.onCreate() ;
      # TaskService + ForegroundTaskPlugin empêchent Android de geler le
      # processus pendant un enregistrement ou une transcription.
      - name: Apply native sources
        working-directory: transcripteur-vocal
        run: |
          cp -R android-src/. android/
          # Rattache signing.gradle sans toucher au build.gradle généré.
          echo "apply from: 'signing.gradle'" >> android/app/build.gradle

      # ── Icône + écran de démarrage ────────────────────────────────────────
      # Remplace les mipmaps par défaut par nos densités (icône « Onde sonore »)
      # et l'écran de démarrage par notre illustration pop-art (WebP unique).
      - name: Apply app icons and splash
        working-directory: transcripteur-vocal
        run: |
          # Supprime les splash.png par défaut pour que @drawable/splash pointe
          # sur notre splash.webp unique (sinon ressource « splash » dupliquée).
          find android/app/src/main/res -name 'splash.png' -delete
          cp -R android-res/. android/app/src/main/res/

      # ── Android SDK ───────────────────────────────────────────────────────
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # ── Java 21 — après setup-android pour gagner la course JAVA_HOME ─────
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ── Permissions et service dans le manifeste ──────────────────────────
      - name: Patch AndroidManifest — permissions and foreground service
        working-directory: transcripteur-vocal/android
        run: |
          M=app/src/main/AndroidManifest.xml
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_DATA_SYNC" />|' \
            "$M"
          sed -i 's|</application>|    <service\n            android:name=".TaskService"\n            android:exported="false"\n            android:foregroundServiceType="microphone\|dataSync" />\n    </application>|' \
            "$M"
          echo "── Manifeste résultant ──"
          cat "$M"

      # NOTE : MainActivity (fourni dans android-src) se limite à
      # registerPlugin() avant super.onCreate(). Une version antérieure
      # recréait un BridgeWebChromeClient dans onResume ; son constructeur
      # appelle registerForActivityResult, interdit après l'état STARTED →
      # IllegalStateException et plantage au démarrage. Le client par défaut de
      # Capacitor gère déjà onPermissionRequest pour le micro.

      # ── Build Gradle ─────────────────────────────────────────────────────
      - name: Make gradlew executable
        working-directory: transcripteur-vocal/android
        run: chmod +x gradlew

      # ── Signature ─────────────────────────────────────────────────────────
      # Les builds debug sont signés avec un keystore que Gradle régénère à
      # chaque exécution : deux builds n'ont donc jamais la même signature et
      # ne peuvent pas se remplacer sur un appareil. Avec le keystore de
      # production en secret, on produit un release signé d'une clé stable,
      # installable par-dessus le précédent. Sans le secret, rien ne change.
      - name: Decode release keystore (si le secret est configuré)
        id: keystore
        working-directory: transcripteur-vocal/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "${KEYSTORE_B64:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > app/release.keystore
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Keystore de production décodé ($(stat -c%s app/release.keystore) octets)."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "Aucun keystore : build debug, non installable par-dessus un build précédent."
          fi

      - name: Build APK
        id: build
        working-directory: transcripteur-vocal/android
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          BUILD_VERSION_NAME: 1.0.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
            APK=transcripteur-vocal/android/app/build/outputs/apk/release/app-release.apk
          else
            ./gradlew assembleDebug --no-daemon
            APK=transcripteur-vocal/android/app/build/outputs/apk/debug/app-debug.apk
          fi
          cd "$GITHUB_WORKSPACE"
          if [ ! -f "$APK" ]; then
            echo "APK introuvable à $APK"; find transcripteur-vocal/android/app/build/outputs -name '*.apk' || true; exit 1
          fi
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "APK produit : $APK ($(stat -c%s "$APK") octets)"

      # ── Test de démarrage (barrière avant publication) ────────────────────
      # Le seul bogue vraiment coûteux de ce projet a été un plantage natif au
      # démarrage, invisible à la compilation. On installe donc l'APK sur un
      # émulateur, on lance l'activité et on échoue si le processus est mort ou
      # si logcat contient une exception fatale. Rien n'est publié sans cela.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test — app must launch without crashing
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          # Une seule ligne : chaque ligne de « script » tourne dans un shell
          # distinct, donc la logique est dans le fichier appelé.
          script: bash transcripteur-vocal/scripts/smoke-test.sh "${{ steps.build.outputs.apk }}"

      # ── Publication ──────────────────────────────────────────────────────
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: transcripteur-vocal-${{ github.run_number }}
          path: ${{ steps.build.outputs.apk }}
          retention-days: 30

      - name: Create GitHub Release with APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            MAJ="Cette version s'installe **par-dessus** la précédente : vos réglages et votre transcription sont conservés."
          else
            MAJ="> Build debug, signé d'une clé différente à chaque build : il faut **désinstaller** la version précédente avant d'installer celle-ci, ce qui efface la clé API et la transcription enregistrées. Ajoutez le secret \`ANDROID_KEYSTORE_BASE64\` pour produire des versions signées et installables par-dessus."
          fi
          gh release create "transcripteur-build-${{ github.run_number }}-${{ github.run_attempt }}" \
            "${{ steps.build.outputs.apk }}#Transcripteur-vocal.apk" \
            --title "Transcripteur vocal — Build ${{ github.run_number }} (v1.0.${{ github.run_number }})" \
            --notes "## Transcripteur vocal — v1.0.${{ github.run_number }}

          Transcription vocale haute qualité en **français canadien** → fichier texte.

          **Compilé depuis :** \`${{ github.ref_name }}\` @ \`${{ github.sha }}\`

          ### Installation sur Android
          1. Téléchargez \`Transcripteur-vocal.apk\`
          2. Sur l'appareil : Paramètres → Applications → Installer des applis inconnues → autorisez votre navigateur
          3. Ouvrez le fichier téléchargé pour installer

          ### Première utilisation
          1. Ouvrez l'app, touchez ⚙️ et collez votre clé API OpenAI (stockée localement sur l'appareil)
          2. Enregistrez ou importez un audio, puis touchez « Transcrire »
          3. Corrigez au besoin, puis « Enregistrer .txt »

          $MAJ"

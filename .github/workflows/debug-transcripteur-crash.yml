name: Debug Transcripteur crash (emulator logcat)
# Re-run to confirm CapacitorHttp does not regress startup.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/android-voice-transcriber-apk-g82j3f
    paths:
      - '.github/workflows/debug-transcripteur-crash.yml'

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install npm dependencies
        working-directory: transcripteur-vocal
        run: npm install

      - name: Build web assets (Vite)
        working-directory: transcripteur-vocal
        run: npm run build

      - name: Add Capacitor Android platform
        working-directory: transcripteur-vocal
        run: npx cap add android

      - name: Sync web assets into Android project
        working-directory: transcripteur-vocal
        run: npx cap sync android

      - name: Apply app icons and splash
        working-directory: transcripteur-vocal
        run: |
          find android/app/src/main/res -name 'splash.png' -delete
          cp -R android-res/. android/app/src/main/res/

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Patch AndroidManifest — add audio permissions
        working-directory: transcripteur-vocal/android
        run: |
          sed -i 's|<uses-permission android:name="android.permission.INTERNET" />|<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />|' \
            app/src/main/AndroidManifest.xml

      # Pas de patch MainActivity : le handler par défaut gère le micro et
      # recréer un BridgeWebChromeClient dans onResume plantait l'app.

      - name: Make gradlew executable
        working-directory: transcripteur-vocal/android
        run: chmod +x gradlew

      - name: Build debug APK
        working-directory: transcripteur-vocal/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run app on emulator and capture logcat
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            adb install -r transcripteur-vocal/android/app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -n com.evoq.transcripteur/.MainActivity
            sleep 12
            echo "================ FULL CRASH / CAPACITOR LOG ================"
            adb logcat -d | grep -iE 'AndroidRuntime|FATAL|beginning of crash|com.evoq.transcripteur|Capacitor|chromium|E WebView|System.err' | head -200 || true
            echo "================ IS PROCESS ALIVE? ================"
            adb shell pidof com.evoq.transcripteur || echo "PROCESS NOT RUNNING (crashed)"

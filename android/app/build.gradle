plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'ca.scribbleaway.transcriber'
    compileSdk 34

    defaultConfig {
        applicationId "ca.scribbleaway.transcriber"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        debug {
            externalNativeBuild {
                cmake {
                    // Keep the native code optimised even for the Debug AGP build
                    // type — otherwise transcription is painfully slow.
                    arguments "-DCMAKE_BUILD_TYPE=Release"
                }
            }
        }
        release {
            // Sign with the debug key so the release APK installs directly when
            // sideloaded. Swap in a real keystore for Play Store distribution.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    // The Whisper model is already a packed binary — don't let aapt re-compress
    // it, so it can be streamed straight out of the APK at load time.
    androidResources {
        noCompress += 'bin'
    }
}

dependencies {
    implementation project(':lib')
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.4'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'androidx.documentfile:documentfile:1.0.1'
}

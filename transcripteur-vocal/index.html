<!DOCTYPE html>
<html lang="fr-CA">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0f172a" />
  <title>Transcripteur vocal</title>
  <link rel="stylesheet" href="/src/styles.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1>Transcripteur vocal</h1>
      <div class="topbar-actions">
        <button id="btn-settings" class="icon-btn" title="Réglages" aria-label="Réglages">⚙️</button>
        <button id="btn-exit" class="icon-btn" title="Quitter" aria-label="Quitter l'application">⏻</button>
      </div>
    </header>

    <main class="content">
      <!-- Enregistrement -->
      <section class="card recorder">
        <div class="timer" id="timer">00:00</div>
        <div class="level-meter" aria-hidden="true"><div class="level-bar" id="level-bar"></div></div>

        <div class="record-controls">
          <button id="btn-record" class="record-btn">
            <span class="rec-dot"></span>
            <span id="record-label">Enregistrer</span>
          </button>
        </div>

        <div class="import-row">
          <label class="link-btn" for="file-input">📂 Importer un fichier audio</label>
          <input id="file-input" type="file" accept="audio/*" hidden />
        </div>

        <audio id="playback" controls hidden></audio>
      </section>

      <!-- Transcription -->
      <section class="card">
        <div class="card-head">
          <h2>Transcription</h2>
          <span id="status" class="status"></span>
        </div>

        <button id="btn-transcribe" class="primary-btn" disabled>Transcrire</button>

        <textarea id="transcript" class="transcript" placeholder="La transcription en français canadien apparaîtra ici. Vous pourrez la corriger avant de l'enregistrer." spellcheck="true"></textarea>

        <div class="actions">
          <button id="btn-copy" class="ghost-btn" disabled>Copier</button>
          <button id="btn-save" class="ghost-btn" disabled>Enregistrer .txt</button>
          <button id="btn-share" class="primary-btn" disabled>Exporter pour génération de compte rendu</button>
        </div>
        <small class="privacy-note">Exporte la transcription vers Claude, Copilot ou une autre appli pour y générer le compte rendu. Anonymisez les noms de personnes, de projets ou d'organisations sensibles au besoin.</small>
      </section>
    </main>

    <!-- Panneau réglages -->
    <div id="settings-overlay" class="overlay" hidden>
      <div class="sheet">
        <div class="card-head">
          <h2>Réglages</h2>
          <button id="btn-close-settings" class="icon-btn" aria-label="Fermer">✕</button>
        </div>

        <label class="field">
          <span>Clé API OpenAI</span>
          <input id="api-key" type="password" placeholder="sk-..." autocomplete="off" />
          <small>Stockée uniquement sur cet appareil. <a href="https://platform.openai.com/api-keys" target="_blank" rel="noopener">Obtenir une clé</a></small>
        </label>

        <label class="field">
          <span>Modèle de transcription</span>
          <select id="model">
            <option value="gpt-4o-transcribe">gpt-4o-transcribe (meilleure qualité)</option>
            <option value="gpt-4o-mini-transcribe">gpt-4o-mini-transcribe (rapide)</option>
            <option value="whisper-1">whisper-1 (compatible, horodatage)</option>
          </select>
        </label>

        <label class="field">
          <span>Amorce / contexte (facultatif)</span>
          <textarea id="prompt-hint" rows="3" placeholder="Noms propres, jargon, régionalismes à privilégier…"></textarea>
          <small>Aide le modèle à orthographier correctement les termes attendus.</small>
        </label>

        <button id="btn-save-settings" class="primary-btn">Enregistrer les réglages</button>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>

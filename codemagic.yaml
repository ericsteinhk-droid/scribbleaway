workflows:
  ios-rapports-de-visite:
    name: Rapports de visite — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      # Variable groups (app → Environment variables):
      #   firebase  → the six VITE_FIREBASE_* values
      #   appstore  → the App Store Connect API key, as three variables:
      #               APP_STORE_CONNECT_ISSUER_ID
      #               APP_STORE_CONNECT_KEY_IDENTIFIER
      #               APP_STORE_CONNECT_PRIVATE_KEY   (full .p8 contents)
      # The signing CLI and the App Store Connect publisher below read these
      # env vars directly — no named "integration" to match.
      groups:
        - firebase
        - appstore
      vars:
        # Capacitor 8 uses Swift Package Manager, not CocoaPods, so the iOS app
        # is built from App.xcodeproj directly (there is no .xcworkspace).
        XCODE_PROJECT: "App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.evoq.rapportsdevisite"
      node: "22"   # Capacitor 8 CLI requires Node >=22 (matches the Android build)
      # NOTE: signing is handled explicitly in the "Set up code signing" script
      # below (with --create) rather than the automatic `ios_signing` block,
      # because a fresh Apple account has no distribution certificate/profile
      # yet and the automatic path only *fetches* existing ones.

    scripts:
      - name: Install npm dependencies
        script: cd rapports-de-visite && npm ci

      - name: Write .env with Firebase config
        script: |
          cat > rapports-de-visite/.env << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF

      - name: Build web assets
        script: cd rapports-de-visite && npm run build

      - name: Add Capacitor iOS platform
        script: cd rapports-de-visite && npx cap add ios

      - name: Patch Info.plist — camera, microphone and photo library permissions
        script: |
          PLIST="rapports-de-visite/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'L'\''appareil photo est utilisé pour prendre des photos lors des visites de chantier.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'Le microphone est utilisé pour dicter vos observations lors des visites de chantier.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'L'\''accès à la galerie permet d'\''importer des photos dans les rapports de visite.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryAddUsageDescription string 'Permet d'\''enregistrer des photos annotées dans votre galerie.'" \
            "$PLIST"
          # Declare no non-exempt encryption so TestFlight skips the manual
          # export-compliance prompt on every build.
          /usr/libexec/PlistBuddy -c \
            "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST"

      - name: Sync Capacitor web assets to iOS
        script: cd rapports-de-visite && npx cap sync ios

      - name: Set up code signing — create certificate & profile if missing
        script: |
          keychain initialize
          # Apple distribution certificates require a private key. It is stored
          # as CERTIFICATE_PRIVATE_KEY_B64 (secure env var, "appstore" group): a
          # single-line base64 of a persistent RSA key, so the certificate is
          # created once and reused on every build. Decode it to a file to avoid
          # any newline mangling of multi-line secure variables.
          # macOS base64 has no --decode flag; use openssl (portable). -A reads
          # the whole single-line value at once.
          printf '%s' "$CERTIFICATE_PRIVATE_KEY_B64" | openssl base64 -d -A > /tmp/cert_key_pkcs1.pem
          # Convert to PKCS#8 ("BEGIN PRIVATE KEY") and expose it through the
          # CERTIFICATE_PRIVATE_KEY env var that fetch-signing-files auto-detects
          # — avoids the @file:/@env: value reference that was being rejected.
          openssl pkcs8 -topk8 -nocrypt -in /tmp/cert_key_pkcs1.pem -out /tmp/cert_key.pem
          export CERTIFICATE_PRIVATE_KEY="$(cat /tmp/cert_key.pem)"
          echo "Signing key ready: $(wc -c < /tmp/cert_key.pem) bytes; header: $(head -1 /tmp/cert_key.pem); env length: ${#CERTIFICATE_PRIVATE_KEY}"
          # Create/fetch the distribution certificate and App Store provisioning
          # profile for the bundle id. Credentials come from APP_STORE_CONNECT_*.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd rapports-de-visite/ios/App
          xcode-project use-profiles

      - name: Set build number from CM_BUILD_ID
        script: |
          cd rapports-de-visite/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS IPA
        script: |
          cd rapports-de-visite/ios/App
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - rapports-de-visite/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Authenticate with the API key supplied via the "appstore" env-var group.
        api_key: $APP_STORE_CONNECT_PRIVATE_KEY
        key_id: $APP_STORE_CONNECT_KEY_IDENTIFIER
        issuer_id: $APP_STORE_CONNECT_ISSUER_ID
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for public App Store release
      email:
        recipients:
          - estein@evoqarchitecture.com
        notify:
          success: true
          failure: true

workflows:
  ios-rapports-de-visite:
    name: Rapports de visite — iOS
    max_build_duration: 60
    instance_type: mac_mini_m2

    # Binds this workflow to the App Store Connect API key you register in
    # Codemagic (Team settings → Integrations → App Store Connect). The
    # integration MUST be named exactly "evoq_asc" to match this reference.
    integrations:
      app_store_connect: evoq_asc

    environment:
      # Loads the six VITE_FIREBASE_* variables. They MUST live in a Codemagic
      # variable group named exactly "firebase" (app → Environment variables).
      groups:
        - firebase
      vars:
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.evoq.rapportsdevisite"
      node: 20.x
      # NOTE: signing is handled explicitly in the "Set up code signing" script
      # below (with --create) rather than the automatic `ios_signing` block,
      # because a fresh Apple account has no distribution certificate/profile
      # yet and the automatic path only *fetches* existing ones.

    scripts:
      - name: Install npm dependencies
        script: cd rapports-de-visite && npm ci

      - name: Write .env with Firebase config
        script: |
          cat > rapports-de-visite/.env << EOF
          VITE_FIREBASE_API_KEY=$VITE_FIREBASE_API_KEY
          VITE_FIREBASE_AUTH_DOMAIN=$VITE_FIREBASE_AUTH_DOMAIN
          VITE_FIREBASE_PROJECT_ID=$VITE_FIREBASE_PROJECT_ID
          VITE_FIREBASE_STORAGE_BUCKET=$VITE_FIREBASE_STORAGE_BUCKET
          VITE_FIREBASE_MESSAGING_SENDER_ID=$VITE_FIREBASE_MESSAGING_SENDER_ID
          VITE_FIREBASE_APP_ID=$VITE_FIREBASE_APP_ID
          EOF

      - name: Build web assets
        script: cd rapports-de-visite && npm run build

      - name: Add Capacitor iOS platform
        script: cd rapports-de-visite && npx cap add ios

      - name: Patch Info.plist — camera, microphone and photo library permissions
        script: |
          PLIST="rapports-de-visite/ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c \
            "Add :NSCameraUsageDescription string 'L'\''appareil photo est utilisé pour prendre des photos lors des visites de chantier.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSMicrophoneUsageDescription string 'Le microphone est utilisé pour dicter vos observations lors des visites de chantier.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryUsageDescription string 'L'\''accès à la galerie permet d'\''importer des photos dans les rapports de visite.'" \
            "$PLIST"
          /usr/libexec/PlistBuddy -c \
            "Add :NSPhotoLibraryAddUsageDescription string 'Permet d'\''enregistrer des photos annotées dans votre galerie.'" \
            "$PLIST"
          # Declare no non-exempt encryption so TestFlight skips the manual
          # export-compliance prompt on every build.
          /usr/libexec/PlistBuddy -c \
            "Add :ITSAppUsesNonExemptEncryption bool false" \
            "$PLIST"

      - name: Sync Capacitor web assets to iOS
        script: cd rapports-de-visite && npx cap sync ios

      - name: Set up code signing — create certificate & profile if missing
        script: |
          keychain initialize
          # Create the iOS distribution certificate and App Store provisioning
          # profile for the bundle id if they don't already exist (fresh Apple
          # account). Uses the evoq_asc App Store Connect API key integration.
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          cd rapports-de-visite/ios/App
          xcode-project use-profiles

      - name: Set build number from CM_BUILD_ID
        script: |
          cd rapports-de-visite/ios/App
          agvtool new-version -all $BUILD_NUMBER

      - name: Build iOS IPA
        script: |
          cd rapports-de-visite/ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - rapports-de-visite/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration   # App Store Connect API key configured in Codemagic dashboard
        submit_to_testflight: true
        submit_to_app_store: false   # flip to true when ready for public App Store release
      email:
        recipients:
          - estein@evoqarchitecture.com
        notify:
          success: true
          failure: true
